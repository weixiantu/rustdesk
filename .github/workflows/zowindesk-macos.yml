name: Build ZowinDesk macOS arm64 (Flutter)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 与 flutter-build.yml（Windows 工作流）保持一致的工具链版本。
  MAC_RUST_VERSION: "1.81" # 1.81 is required for macos, because of https://github.com/yury/cidre requires 1.81
  FLUTTER_MACOS_ARM_VERSION: "3.44.9" # macOS arm64: 3.24.5's engine crashes in attributedSubstringForProposedRange (rustdesk#16817)
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1" # 协议版本占位；对外版本号 V14 在打包时写入 Info.plist
  ZD_VERSION: "V14"
  ZD_BUILD: "14"
  UPLOAD_ARTIFACT: "true"

jobs:
  # 复用 Windows / Android 同一条 bridge 生成链；macOS arm64 使用 Flutter 3.44 专用产物。
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-zowindesk-macos:
    name: ZowinDesk macOS arm64
    needs: [generate-bridge]
    runs-on: macos-14
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install GNU sed, LLVM, create-dmg, pkg-config
        run: |
          # apply_flutter_3.44_source_patches.sh 与后续 sed -i 都是 GNU 语义，
          # BSD sed 不兼容，必须把 GNU coreutils 的 gnubin 放到 PATH 最前。
          brew install coreutils llvm create-dmg
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
          else
            brew install pkg-config
          fi
          sed --version | head -1

      - name: Install NASM
        run: |
          # 必须用 NASM 2.16.x，brew 安装的 3.x 与 aom 等多媒体库的汇编不兼容。
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Workaround for flutter issue
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' \
            ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-14

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # macOS arm64 用 Flutter 3.44 构建，必须配 3.44 生成的 bridge
          # （*.freezed.dart 要与构建解析到的 freezed 版本一致）。
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 60 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-osx-rel-out.log" || true

      - name: Apply ZowinDesk patches (server / brand / upgrade / icon)
        run: |
          python3 .github/zowindesk/zd_macos_patch.py .github/zowindesk
          echo "--- verify ---"
          grep -n "hide-server-settings" libs/hbb_common/src/config.rs src/common.rs | head -4
          grep -c "43.139.157.84" libs/hbb_common/src/config.rs
          ls -l flutter/lib/zd_version.dart flutter/lib/zd_upgrade.dart flutter/macos/Runner/AppIcon.icns

      - name: Apply Flutter 3.44 source patches
        run: |
          # 与 bridge-artifact-flutter-3.44 的生成状态保持一致（pubspec/主题 API 差异）。
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Show version information (Rust, cargo, Clang)
        run: |
          clang --version || true
          rustup -V
          cargo -V
          rustc -V

      - name: Build rustdesk
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Stamp ZowinDesk release version into the app bundle
        run: |
          APP="flutter/build/macos/Build/Products/Release/ZowinDesk.app"
          test -d "$APP" || { echo "ZowinDesk.app not found"; ls flutter/build/macos/Build/Products/Release/; exit 1; }
          # pubspec 版本号保持 1.5.1（协议版本比较用），对外版本号写 V14。
          plutil -replace CFBundleShortVersionString -string "${{ env.ZD_VERSION }}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "${{ env.ZD_BUILD }}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleName -string "ZowinDesk" "$APP/Contents/Info.plist"
          plutil -replace CFBundleDisplayName -string "ZowinDesk" "$APP/Contents/Info.plist"
          # 改过 Info.plist 后签名失效，做一次 ad-hoc 重签（未公证包，用户首次打开仍需右键/系统设置放行）。
          codesign --force --deep -s - "$APP" 2>/dev/null || true
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleName|CFBundleShortVersionString|CFBundleVersion|CFBundleIdentifier"

      - name: Create ZowinDesk DMG
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "ZowinDesk Installer" \
            --icon "ZowinDesk.app" 200 190 \
            --hide-extension "ZowinDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            ZowinDesk-macOS-arm64.dmg \
            ./flutter/build/macos/Build/Products/Release/ZowinDesk.app

      - name: Upload ZowinDesk macOS DMG
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zowindesk-macos-arm64
          path: ZowinDesk-macOS-arm64.dmg
