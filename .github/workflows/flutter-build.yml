name: Build ZowinDesk Windows x64 (Flutter)

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform except macOS arm64 (below) stays on FLUTTER_VERSION
  # (3.24.5) until Windows 7 support is restored after the upstream-wide Flutter bump. The 3.44
  # jobs patch the few 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources
  # for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # macOS arm64 only: 3.24.5's engine crashes in attributedSubstringForProposedRange
  # (https://github.com/rustdesk/rustdesk/issues/16817, https://github.com/flutter/flutter/issues/153157).
  # x86_64 stays on FLUTTER_VERSION: 3.44's FlutterMacOS needs macOS 10.15 there, and it targets 10.14.
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "nightly"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.1"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "true"
  PUBLISH_UPDATE_METADATA: "false"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
jobs:
  validate-update-metadata-keys:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        if: false
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python
        if: false
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: false
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Test update metadata signer
        if: false
        run: |
          python -m unittest \
            res/update/test_generate_update_metadata.py \
            res/update/test_update_metadata_cli.py \
            res/update/test_macos_update_scripts.py

      - name: Validate update metadata keys
        if: false
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: python res/update/generate_update_metadata.py check-key

  generate-bridge:
    needs: [validate-update-metadata-keys]
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    needs: [validate-update-metadata-keys]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: windows-2022,
              platform: x64,
            }
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Patch server config and branding (ZowinDesk)
        shell: bash
        run: |
          python3 - <<'EOF'
          import re
          # 1. Server config + APP_NAME (hbb_common config.rs)
          #    Only the "ID/Relay Server" row is hidden; the Network tab itself stays visible.
          #    IP/Key stay as plain consts (same as the verified Run #9 build).
          p = 'libs/hbb_common/src/config.rs'
          s = open(p, encoding='utf-8').read()
          s2, n1 = re.subn(r'pub const RENDEZVOUS_SERVERS[^;]*;',
                           'pub const RENDEZVOUS_SERVERS: &[&str] = &["43.139.157.84"];',
                           s, count=1)
          assert n1 == 1, 'RENDEZVOUS_SERVERS definition not found'
          s2, n2 = re.subn(r'pub const RS_PUB_KEY[^;]*;',
                           'pub const RS_PUB_KEY: &str = "PMEoK7kHVXLlHB4td8wk13ezTwKABynXQucZURTZtuo=";',
                           s2, count=1)
          assert n2 == 1, 'RS_PUB_KEY definition not found'
          s2 = s2.replace('RwLock::new("RustDesk".to_owned())',
                          'RwLock::new("ZowinDesk".to_owned())')
          bs_old = 'pub static ref BUILTIN_SETTINGS: RwLock<HashMap<String, String>> = Default::default();'
          bs_new = '\n'.join([
              'pub static ref BUILTIN_SETTINGS: RwLock<HashMap<String, String>> = {',
              '        let mut m = HashMap::new();',
              '        m.insert("hide-server-settings".to_owned(), "Y".to_owned());',
              '        RwLock::new(m)',
              '    };',
          ])
          assert bs_old in s2, 'BUILTIN_SETTINGS definition not found'
          s2 = s2.replace(bs_old, bs_new, 1)
          assert 'RwLock::new("ZowinDesk"' in s2, 'config patch failed'
          assert '43.139.157.84' in s2 and 'PMEoK7' in s2, 'server config not applied'
          assert 'hide-network-settings' not in s2, 'network tab must stay visible'
          assert 'zd_decode' not in s2 and 'ZD_XOR' not in s2, 'obfuscation must be reverted'
          open(p, 'w', encoding='utf-8').write(s2)
          print('config.rs Patched OK (endpoints + only the ID/Relay Server row hidden)')

          # 1b. Force the official hide-server-settings switch on (ignore config file)
          pf = 'src/common.rs'
          t = open(pf, encoding='utf-8').read()
          gb_old = '\n'.join([
              'pub fn get_builtin_option(key: &str) -> String {',
              '    config::BUILTIN_SETTINGS',
          ])
          gb_new = '\n'.join([
              'pub fn get_builtin_option(key: &str) -> String {',
              '    if key == "hide-server-settings" {',
              '        return "Y".to_owned();',
              '    }',
              '    config::BUILTIN_SETTINGS',
          ])
          assert gb_old in t, 'get_builtin_option body not found'
          t = t.replace(gb_old, gb_new, 1)
          open(pf, 'w', encoding='utf-8').write(t)
          print('get_builtin_option patched OK (only the ID/Relay Server row hidden)')
          # 2. Runner.rc (exe properties: ProductName / FileDescription / CompanyName)
          p3 = 'flutter/windows/runner/Runner.rc'
          s3 = open(p3, encoding='utf-8').read()
          s3 = s3.replace('"RustDesk Remote Desktop"', '"ZowinDesk Remote Desktop"')
          s3 = s3.replace('"ProductName", "RustDesk"', '"ProductName", "ZowinDesk"')
          s3 = s3.replace('"CompanyName", "Purslane Tech Pte. Ltd."', '"CompanyName", "ZowinDesk"')
          s3 = s3.replace('"OriginalFilename", "rustdesk.exe"', '"OriginalFilename", "ZowinDesk.exe"')
          assert '"ProductName", "ZowinDesk"' in s3, 'Runner.rc patch failed'
          open(p3, 'w', encoding='utf-8').write(s3)
          print('Runner.rc Patched OK')
          # 3. Packer (installer exe) version info from winres metadata in Cargo.toml
          p4 = 'libs/portable/Cargo.toml'
          s4 = open(p4, encoding='utf-8').read()
          s4 = s4.replace('description = "RustDesk Remote Desktop"',
                          'description = "ZowinDesk Remote Desktop"')
          s4 = s4.replace('ProductName = "RustDesk"', 'ProductName = "ZowinDesk"')
          s4 = s4.replace('OriginalFilename = "rustdesk.exe"', 'OriginalFilename = "ZowinDesk.exe"')
          s4 = s4.replace('FileDescription = "RustDesk Remote Desktop"',
                          'FileDescription = "ZowinDesk Remote Desktop"\nCompanyName = "ZowinDesk"')
          assert 'ProductName = "ZowinDesk"' in s4, 'packer Cargo.toml patch failed'
          assert 'OriginalFilename = "ZowinDesk.exe"' in s4, 'packer OriginalFilename patch failed'
          open(p4, 'w', encoding='utf-8').write(s4)
          print('packer Cargo.toml Patched OK')
          # 4. main.cpp fallback app_name (window title fallback)
          p5 = 'flutter/windows/runner/main.cpp'
          s5 = open(p5, encoding='utf-8').read()
          s5 = s5.replace('std::wstring app_name = L"RustDesk";',
                          'std::wstring app_name = L"ZowinDesk";')
          open(p5, 'w', encoding='utf-8').write(s5)
          print('main.cpp patched:', 'L"ZowinDesk"' in s5)
          # 5. Dart UI: hide "Powered by" badge, redirect rustdesk.com links to company site
          p6 = 'flutter/lib/common.dart'
          s6 = open(p6, encoding='utf-8').read()
          o6 = 'bind.mainGetBuildinOption(key: "hide-powered-by-me") == \'Y\''
          assert o6 in s6, 'powered-by condition not found'
          s6 = s6.replace(o6, 'true')
          open(p6, 'w', encoding='utf-8').write(s6)
          print('common.dart powered-by hidden OK')
          p7 = 'flutter/lib/desktop/pages/desktop_setting_page.dart'
          s7 = open(p7, encoding='utf-8').read()
          assert 'https://rustdesk.com/privacy.html' in s7, 'about privacy link not found'
          s7 = s7.replace("launchUrlString('https://rustdesk.com/privacy.html')",
                          "launchUrlString('https://www.zowinda.com')")
          s7 = s7.replace("launchUrlString('https://rustdesk.com')",
                          "launchUrlString('https://www.zowinda.com')")
          open(p7, 'w', encoding='utf-8').write(s7)
          print('desktop_setting_page.dart links OK')
          p8 = 'flutter/lib/desktop/pages/install_page.dart'
          s8 = open(p8, encoding='utf-8').read()
          assert 'https://rustdesk.com/privacy.html' in s8, 'install eula link not found'
          s8 = s8.replace('https://rustdesk.com/privacy.html', 'https://www.zowinda.com')
          open(p8, 'w', encoding='utf-8').write(s8)
          print('install_page.dart eula OK')
          p9 = 'flutter/lib/mobile/pages/settings_page.dart'
          s9 = open(p9, encoding='utf-8').read()
          s9 = s9.replace('https://rustdesk.com/privacy.html', 'https://www.zowinda.com')
          s9 = s9.replace("launchUrlString('https://rustdesk.com')", "launchUrlString('https://www.zowinda.com')")
          open(p9, 'w', encoding='utf-8').write(s9)
          print('mobile settings_page.dart links OK')
          # 6. Bottom status bar: hide the "setup your own server" guide LINK, keep "Ready"
          p10 = 'flutter/lib/desktop/pages/connection_page.dart'
          s10 = open(p10, encoding='utf-8').read()
          s10, n10 = re.subn(r'offstage: !\(!_svcStopped\.value &&\s+stateGlobal\.svcStatus\.value == SvcStatus\.ready &&\s+_svcIsUsingPublicServer\.value\),',
                             'offstage: true,  // ZowinDesk: official guide link removed', s10)
          assert n10 == 1, 'setup-server offstage not found: %d' % n10
          open(p10, 'w', encoding='utf-8').write(s10)
          print('connection_page.dart: guide link hidden, Ready text kept')
          # 7. Hide the blue "Login" button in address book (opens official account page)
          p11 = 'flutter/lib/common/widgets/address_book.dart'
          s11 = open(p11, encoding='utf-8').read()
          s11, n11 = re.subn(r'return Center\(\s*child: ElevatedButton\(\s*onPressed: loginDialog, child: Text\(translate\("Login"\)\)\)\);',
                             'return const SizedBox.shrink();  // ZowinDesk: official login removed', s11)
          assert n11 == 1, 'address book login button not found: %d' % n11
          open(p11, 'w', encoding='utf-8').write(s11)
          print('address_book.dart: login button hidden')
          # 8. Disable loginDialog() so every remaining account entry is a no-op
          p12 = 'flutter/lib/common/widgets/login.dart'
          s12 = open(p12, encoding='utf-8').read()
          old12 = 'Future<bool?> loginDialog() {\n  final activeDialog = _activeLoginDialog;'
          assert old12 in s12, 'loginDialog() definition not found'
          s12 = s12.replace(old12,
                            'Future<bool?> loginDialog() {\n  return Future<bool?>.value(false);  // ZowinDesk: official login disabled\n  // ignore: dead_code\n  final activeDialog = _activeLoginDialog;', 1)
          open(p12, 'w', encoding='utf-8').write(s12)
          print('login.dart: loginDialog disabled')
          # 9. Hide the Account card in settings (Login / Logout entry)
          p13 = 'flutter/lib/desktop/pages/desktop_setting_page.dart'
          s13 = open(p13, encoding='utf-8').read()
          s13, n13 = re.subn(r"_Card\(title: 'Account', children: \[accountAction\(\), useInfo\(\)\]\),",
                             '// ZowinDesk: official account card removed', s13)
          assert n13 == 1, 'account card not found: %d' % n13
          open(p13, 'w', encoding='utf-8').write(s13)
          print('desktop_setting_page.dart: account card hidden')
          # 10. Defensive: replace every remaining official URL in Flutter UI sources
          ui_files = ['flutter/lib/common.dart',
                      'flutter/lib/desktop/pages/desktop_home_page.dart',
                      'flutter/lib/desktop/pages/connection_page.dart',
                      'flutter/lib/desktop/pages/desktop_setting_page.dart',
                      'flutter/lib/desktop/pages/install_page.dart',
                      'flutter/lib/mobile/pages/settings_page.dart',
                      'flutter/lib/mobile/pages/connection_page.dart']
          for p in ui_files:
              try:
                  t = open(p, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              cnt = t.count('https://rustdesk.com') + t.count('https://github.com/rustdesk')
              if cnt:
                  t = t.replace('https://github.com/rustdesk/rustdesk', 'https://www.zowinda.com')
                  t = t.replace('https://rustdesk.com', 'https://www.zowinda.com')
                  open(p, 'w', encoding='utf-8').write(t)
              print('  official links replaced:', p, cnt)
          # 11. Installer console caption (visible if an install ever fails)
          p14 = 'src/platform/windows.rs'
          s14 = open(p14, encoding='utf-8').read()
          s14 = s14.replace('let caption = "RustDesk Output"', 'let caption = "ZowinDesk Output"')
          open(p14, 'w', encoding='utf-8').write(s14)
          print('windows.rs caption patched:', '"ZowinDesk Output"' in s14)
          # 12. Portable packer: a plain double-click ALWAYS opens the install page.
          #     Stock behaviour only does this when the exe name ends with "install.exe";
          #     WeChat/QQ/browser downloads may append "(1)" or users rename the file,
          #     which silently falls back to the un-installed main window (UAC warning).
          #     Keep Quick Support builds on their dedicated no-install path.
          p15 = 'libs/portable/src/main.rs'
          s15 = open(p15, encoding='utf-8').read()
          old15 = 'let click_setup = args.is_empty() && arg_exe.to_lowercase().ends_with("install.exe");'
          new15 = ('// ZowinDesk: a plain double-click always opens the install page,\n'
                   '    // independent of the downloaded file name.\n'
                   '    let click_setup = args.is_empty();')
          assert old15 in s15, 'portable main.rs click_setup pattern not found'
          s15 = s15.replace(old15, new15, 1)
          old15b = ('        if click_setup {\n'
                    '            args = vec!["--install".to_owned()];\n'
                    '        } else if quick_support {')
          new15b = ('        if click_setup && !quick_support {\n'
                    '            args = vec!["--install".to_owned()];\n'
                    '        } else if quick_support {')
          assert old15b in s15, 'portable main.rs install branch not found'
          s15 = s15.replace(old15b, new15b, 1)
          open(p15, 'w', encoding='utf-8').write(s15)
          print('portable packer always-install patched OK')
          # 13. ZowinDesk force-upgrade (pure Dart; no Rust FFI / bridge regeneration).
          #     Before the key rotation: version.json min_build <= 12 -> completely silent,
          #     users install and use immediately with zero prompts.
          #     After the rotation: raise min_build -> un-dismissable dialog -> auto download
          #     from the fixed URL -> launch the installer (UAC handled by ShellExecute).
          #     The check uses plain HTTPS, never the hbbs channel (which is down after a key swap).
          import base64
          zd_b64 = (
              'Ly8gPT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09'
              'PT09PT09PQovLyBab3dpbkRlc2sg5by65Yi25Y2H57qn5qih5Z2X77yI57qvIERhcnQg5a6e546w77yM5LiN5pS55YqoIFJ1'
              'c3QgLyBmbHV0dGVyX3J1c3RfYnJpZGdl77yJCi8vCi8vIOebruagh++8mgovLyAgIDEpIOWJjeacn++8iOeJiOacrOa4heWN'
              'lSBtaW5fYnVpbGQgPD0ga1pkQnVpbGTvvInlrozlhajpnZnpu5jvvIzoo4XlrozljbPnlKjjgIHpm7bmiZPmibDvvJsKLy8g'
              'ICAyKSDlkI7lj7Dmm7TmjaIgS2V5IOWQju+8jOaKiua4heWNlSBtaW5fYnVpbGQg6LCD6auY77yM5pen5a6i5oi356uv5by5'
              '5Ye65LiN5Y+v5YWz6Zet55qECi8vICAgICAg5Y2H57qn5o+Q56S677yb54K55Ye744CM56uL5Y2z5Y2H57qn44CN6Ieq5Yqo'
              '5LuO5Zu65a6a5Zyw5Z2A5LiL6L295paw5YyF5bm25ouJ6LW35a6J6KOF55WM6Z2i77ybCi8vICAgMykg5qOA5p+l6LWw54us'
              '56uLIEhUVFBT77yM5LiN5L6d6LWWIGhiYnMg6YCa6YGT77yI5o2iIEtleSDlkI7or6XpgJrpgZPmnKzouqvlt7Lmlq3vvInj'
              'gIIKLy8KLy8g6Kem5Y+R5pe25py677ya5ZCv5Yqo5ZCOIDMg56eSIC8g5q+PIDEwIOWIhumSnyAvIOi/nuaOpeWHuumUmeaX'
              'tu+8iDUg5YiG6ZKf6IqC5rWB77yJ44CCCi8vID09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09'
              'PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0KCmltcG9ydCAnZGFydDphc3luYyc7CmltcG9ydCAnZGFydDpjb252'
              'ZXJ0JzsKaW1wb3J0ICdkYXJ0OmlvJzsKCi8vIGNyeXB0byDlt7LlnKggcHVic3BlYy5sb2NrIOS4re+8iOS8oOmAkuS+nei1'
              'lu+8ie+8jOaVheS4jeaUueWKqCBwdWJzcGVjLnlhbWzjgIIKLy8gaWdub3JlOiBkZXBlbmRfb25fcmVmZXJlbmNlZF9wYWNr'
              'YWdlcwppbXBvcnQgJ3BhY2thZ2U6Y3J5cHRvL2NyeXB0by5kYXJ0JzsKaW1wb3J0ICdwYWNrYWdlOmZsdXR0ZXIvbWF0ZXJp'
              'YWwuZGFydCc7CmltcG9ydCAncGFja2FnZTpnZXQvZ2V0LmRhcnQnOwppbXBvcnQgJ3BhY2thZ2U6aHR0cC9odHRwLmRhcnQn'
              'IGFzIGh0dHA7CmltcG9ydCAncGFja2FnZTp1cmxfbGF1bmNoZXIvdXJsX2xhdW5jaGVyLmRhcnQnOwoKLy8vIOacrOWuouaI'
              't+err+eahCBidWlsZCDlj7fjgIIKLy8vIOS7peWQjuavj+asoeWPkeihjOaWsOeJiOacrO+8muWPquaKiui/meS4quaVsOWt'
              'lyArMe+8jOW5tuaKiuacjeWKoeWZqCB2ZXJzaW9uLmpzb24g55qECi8vLyBtaW5fYnVpbGQg6K6+5Li65ZCM5LiA5Liq5pWw'
              '5a2X5Y2z5Y+v77yM5LiL6L295Zyw5Z2A5LiO5paH5Lu25ZCN5rC46L+c5LiN5Y+Y44CCCmNvbnN0IGludCBrWmRCdWlsZCA9'
              'IDEyOwoKLy8vIOeJiOacrOa4heWNleWcsOWdgO+8jOWbuuWumuS4jeWPmO+8jOaJgOacieeJiOacrOWFseeUqOOAggpjb25z'
              'dCBTdHJpbmcga1pkVmVyc2lvblVybCA9ICdodHRwczovL3d3dy56b3dpbmRhLmNvbS96b3dpbmRlc2svdmVyc2lvbi5qc29u'
