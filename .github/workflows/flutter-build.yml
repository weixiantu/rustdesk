              'CiAgICAgIHN0YXR1cy52YWx1ZSA9ICflronoo4XnqIvluo/lt7LlkK/liqjvvIzor7flnKjlvLnlh7rnmoTnqpflj6PkuK3l'
              'rozmiJDlronoo4XjgIInOwogICAgfSBjYXRjaCAoZSkgewogICAgICBwaGFzZS52YWx1ZSA9IDM7CiAgICAgIHN0YXR1cy52'
              'YWx1ZSA9ICfkuIvovb3miJblkK/liqjlpLHotKXvvJokZVxu5a6J6KOF5YyF5bey5L+d5a2Y5Yiw77yaJF9sb2NhbFBhdGgn'
              'OwogICAgfSBmaW5hbGx5IHsKICAgICAgY2xpZW50LmNsb3NlKCk7CiAgICB9CiAgfQoKICAvLy8g5YWI55u05o6l5ZCv5Yqo'
              '77yb6Iul5b2T5YmN6L+b56iL5pyq5o+Q5p2D77yIQ3JlYXRlUHJvY2VzcyDooqsgVUFDIOaLkue7ne+8ie+8jAogIC8vLyDl'
              'ho3nlKggdXJsX2xhdW5jaGVyIOi1sCBTaGVsbEV4ZWN1dGXvvIzorqnns7vnu5/lvLnlh7ogVUFDIOaPkOadg+ahhuOAggog'
              'IHN0YXRpYyBGdXR1cmU8dm9pZD4gX2xhdW5jaEluc3RhbGxlcihGaWxlIGYpIGFzeW5jIHsKICAgIHRyeSB7CiAgICAgIGF3'
              'YWl0IFByb2Nlc3Muc3RhcnQoZi5wYXRoLCBbXSwgbW9kZTogUHJvY2Vzc1N0YXJ0TW9kZS5kZXRhY2hlZCk7CiAgICAgIHJl'
              'dHVybjsKICAgIH0gY2F0Y2ggKF8pIHsKICAgICAgLy8g5pyq5o+Q5p2D5pe2IFdpbmRvd3Mg5Lya5ouS57udIENyZWF0ZVBy'
              'b2Nlc3PvvIzotbDkuIvkuIDmnaEgU2hlbGxFeGVjdXRlIOi3r+W+hOOAggogICAgfQogICAgZmluYWwgb2sgPSBhd2FpdCBs'
              'YXVuY2hVcmwoVXJpLmZpbGUoZi5wYXRoKSwKICAgICAgICBtb2RlOiBMYXVuY2hNb2RlLmV4dGVybmFsQXBwbGljYXRpb24p'
              'OwogICAgaWYgKCFvaykgdGhyb3cgJ+aXoOazleiHquWKqOWQr+WKqOWuieijheeoi+W6j++8iOivt+aJi+WKqOWPjOWHu+W3'
              'suS4i+i9veeahOaWh+S7tu+8iSc7CiAgfQp9Cg=='
          )
          zd_src = base64.b64decode(zd_b64).decode('utf-8')
          open('flutter/lib/zd_upgrade.dart', 'w', encoding='utf-8').write(zd_src)
          assert 'kZdBuild = 12' in zd_src, 'build number missing'
          assert 'https://www.zowinda.com/zowindesk/version.json' in zd_src, 'manifest URL missing'
          assert 'ZowinDesk-Setup-x86_64.exe' in zd_src, 'fixed installer name missing'
          print('zd_upgrade.dart written OK:', len(zd_src), 'chars')

          # 13b. Hook the silent watcher into the main desktop page.
          pf = 'flutter/lib/desktop/pages/desktop_home_page.dart'
          t = open(pf, encoding='utf-8').read()
          imp_old = "import 'package:flutter_hbb/common.dart';"
          assert imp_old in t, 'common.dart import not found'
          t = t.replace(imp_old, imp_old + "\nimport 'package:flutter_hbb/zd_upgrade.dart';", 1)
          err_old = '      final error = await bind.mainGetError();\n'
          err_new = err_old + '\n'.join([
              '      if (error.isNotEmpty) {',
              '        ZdUpgrade.onConnectionFailure();  // ZowinDesk: recheck manifest when the link breaks',
              '      }',
              '',
          ])
          assert t.count(err_old) == 1, 'mainGetError call site not unique'
          t = t.replace(err_old, err_new, 1)
          obs_old = '    WidgetsBinding.instance.addObserver(this);\n'
          assert t.count(obs_old) == 1, 'initState addObserver not unique'
          t = t.replace(obs_old, obs_old + '    ZdUpgrade.start();  // ZowinDesk: silent force-upgrade watcher\n', 1)
          dis_old = '    _updateTimer?.cancel();\n'
          assert t.count(dis_old) == 1, 'dispose timer cancel not unique'
          t = t.replace(dis_old, dis_old + '    ZdUpgrade.stop();\n', 1)
          assert t.count('ZdUpgrade.') >= 3, 'ZdUpgrade hooks not applied'
          open(pf, 'w', encoding='utf-8').write(t)
          print('desktop_home_page.dart patched OK (ZdUpgrade start/stop/onConnectionFailure)')
          EOF
          grep -n "hide-server-settings" src/common.rs | head -3
          grep -c "RENDEZVOUS_SERVERS\|RS_PUB_KEY" libs/hbb_common/src/config.rs
          grep -n "ZowinDesk" flutter/windows/runner/Runner.rc
          grep -n "ZowinDesk" libs/portable/Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
          name: 'bridge-artifact'
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      - name: Force arm64 Dart SDK + engine
        # The x64 SDK subosito installs bundles an x64 Dart with a matching engine-dart-sdk.stamp,
        # so update_dart_sdk.ps1 short-circuits (stamp matches -> return) and keeps x64 Dart;
        # `flutter build windows` then targets the Dart VM's arch = x64, even on this arm64 host.
        # On this native-arm64 runner (PROCESSOR_ARCHITECTURE=ARM64), deleting the stamp and
        # re-running update_dart_sdk.ps1 pulls the arm64 Dart (available since Flutter 3.44.0).
        # https://github.com/flutter/flutter/issues/186730#issuecomment-4573214964
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: |
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Flutter root: $flutterRoot"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          # Confirm the Dart we ended up with is arm64 ("on windows_arm64"); fail loudly if not.
          $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVer
          if ($dartVer -notmatch "windows_arm64") {
            Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
            exit 1
          }
          & "$flutterRoot\bin\flutter.bat" precache --windows
          # Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should
          # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.
          $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
          Write-Host "Engine artifacts present:"
          Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
          if (-not (Test-Path "$engineDir\windows-arm64-release")) {
            Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
            exit 1
          }

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
      - name: Replace engine with rustdesk custom flutter engine
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # arm64 is on Flutter 3.44 (as is macOS arm64); apply its source/pubspec deltas on the fly
        # (shared with the macOS arm64 build and the 3.44 bridge job) so the committed sources
        # stay on Flutter 3.24.5.
        # `flutter build` then runs `pub get`, regenerating pubspec.lock for the bumped deps.
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one
        # (only for arm64 — leaving it unset lets x64 use the crate's bundled lib).
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: Run the Rust tests
        # x86_64 only: the tests are the same code on arm64, and that runner is the slow one.
        if: ${{ !inputs.upload-artifact && matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          # The build's own features, so the tests see the code that ships.
          FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }} --print-features)
          cargo test --locked --release --lib --features "$FEATURES"
          # Its Windows tests run nowhere else.
          cargo test --locked --release -p clipboard

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: true
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
          path: "./rustdesk"

      - name: Upload unsigned
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
          path: rustdesk

      - name: Sign rustdesk files
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

      - name: Verify Windows Flutter version
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true'
        shell: powershell
        run: |
          $reportedVersion = (& ".\rustdesk\rustdesk.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "rustdesk --version exited with $LASTEXITCODE"
          }
          if ($reportedVersion -cne $env:VERSION) {
            throw "RustDesk reports version '$reportedVersion', expected '$env:VERSION'"
          }

      - name: Verify template payload signatures
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: powershell
        run: |
          Get-ChildItem ./rustdesk -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Extension -eq '.exe' -or ($_.Extension -eq '.dll' -and $_.FullName -notmatch 'RustDeskPrinterDriver|usbmmidd_v2') } |
            ForEach-Object {
              $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName -ErrorAction Stop
              if ($signature.Status -ne 'Valid') { throw "Invalid template payload signature: $($_.FullName) ($($signature.Status))" }
            }

      - name: Build template packer
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -e rustdesk.exe -l 11 -t "${{ matrix.job.target }}" --exclude-exe
          popd
          mkdir -p ./packer-template
          cp ./target/${{ matrix.job.target }}/release/rustdesk-portable-packer.exe ./packer-template/rustdesk-template-${{ matrix.job.arch }}.exe

      - name: Upload unsigned template packer
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-packer-template-${{ matrix.job.arch }}
          path: ./packer-template
          if-no-files-found: error

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # ZowinDesk: the installer derives the main exe as <APP_NAME>.exe (ZowinDesk.exe).
          # Official builds rely on Windows case-insensitivity (RustDesk.exe == rustdesk.exe),
          # which breaks once APP_NAME is rebranded. Ship a same-content copy so that services,
          # shortcuts, config import and run-after-install all resolve to a real file.
          cp ./rustdesk/rustdesk.exe ./rustdesk/ZowinDesk.exe
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/ZowinDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          # Select the MSBuild process architecture; -p:Platform sets the MSI target.
          # Native ARM64 tools give the compiler more address space for PCH files
          # (C3859/C1076 were reported by HostX86\arm64\CL.exe).
          # Keep the action's default x86 MSBuild for the existing x64 MSI job.
          msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}

      - name: Build msi
        # Builds the MSI for the matrix arch. res/msi (WiX v4 + native CustomActions) carries
        # both x64 and ARM64 platform configs; WcaUtil/DUtil ship arm64 libs. msbuild platform
        # is x64 / ARM64; the produced Package.msi is globbed since its bin/<platform>/ dir varies.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cp ./rustdesk/rustdesk.exe ./rustdesk/ZowinDesk.exe
          pushd ./res/msi
          python preprocess.py --arp --app-name ZowinDesk -d ../../rustdesk
          nuget restore msi.sln
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/ZowinDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
          sha256sum ../../SignOutput/ZowinDesk-*.msi

      - name: Build pre-built MSI template
        # Two things this works around: preprocess.py rewrites res/msi in place, so the
        # tree is reset around this second variant; and it locates the app as
        # <app-name>.exe inside the dist, so the dist copy is renamed to match.
        #
        # The placeholder is chosen to keep this template as close to the shipped msi as
        # possible: eight characters like "RustDesk", and a valid 8.3 name, so WiX
        # derives no short name for it. A longer placeholder would get one, and a patch
        # cannot rewrite a truncated placeholder, leaving short names pointing at it.
        #
        # It still has to be unique, which is why "RustDesk" itself cannot be used:
        # it also names payload that must never be renamed, such as librustdesk.dll
        # and drivers\RustDeskPrinterDriver.
        #
        #
        # Building the arm64 template on the native arm64 runner makes the ARM
        # package available: the build agents are x64 and cannot run
        # preprocess.py against an ARM exe.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          git checkout -- res/msi
          cp -r ./rustdesk ./rustdesk-msi-template
          mv ./rustdesk-msi-template/rustdesk.exe ./rustdesk-msi-template/RDAPPNAM.exe
          Remove-Item ./rustdesk-msi-template/ZowinDesk.exe -ErrorAction SilentlyContinue
          Set-Content -Path ./rustdesk-msi-template/custom.txt -Value 'placeholder' -NoNewline
          $assets = './rustdesk-msi-template/data/flutter_assets/assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          foreach ($a in 'icon.ico','icon.png','logo.png','logo_light.png','logo_dark.png') {
            Set-Content -Path "$assets/$a" -Value 'placeholder' -NoNewline
          }
          pushd ./res/msi
          python preprocess.py --arp --template --revision-version 0 -d ../../rustdesk-msi-template --app-name RDAPPNAM
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=$msiPlatform
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir ./msi-template
          mv $msi.FullName ./msi-template/rustdesk-template-${{ matrix.job.arch }}.msi
          git checkout -- res/msi
          rm -r -fo ./rustdesk-msi-template

      - name: Upload unsigned msi template
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-msi-template-${{ matrix.job.arch }}
          path: ./msi-template

      - name: Sign rustdesk self-extracted file
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

      - name: Upload signed Windows Flutter EXE
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-flutter-${{ matrix.job.arch }}-exe
          path: ./SignOutput/ZowinDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          if-no-files-found: error

      - name: Upload signed Windows Flutter MSI
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-flutter-${{ matrix.job.arch }}-msi
          path: ./SignOutput/ZowinDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true'
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/ZowinDesk-*.msi
            ./SignOutput/ZowinDesk-*.exe

  # The fallback for the flutter version, we use Sciter for 32bit Windows.
