name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  LLVM_VERSION: "15.0.6"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.LLVM_VERSION }}

    - name: Set LIBCLANG_PATH
      run: |
        $llvmPath = "${env:LLVM_PATH}\bin"
        if (Test-Path "$llvmPath\libclang.dll") {
          echo "LIBCLANG_PATH=$llvmPath\libclang.dll" >> $env:GITHUB_ENV
          echo "$llvmPath" >> $env:GITHUB_PATH
          echo "Found libclang.dll at $llvmPath"
        } else {
          echo "ERROR: libclang.dll not found at $llvmPath"
          exit 1
        }
      shell: pwsh

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet x64-windows-static \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
      shell: bash
      timeout-minutes: 180

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: C:\vcpkg
        LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

    - name: Download sciter.dll from official RustDesk release
      run: |
        # 从官方 RustDesk 发布页面下载 sciter.dll
        $releaseUrl = "https://github.com/rustdesk/rustdesk/releases/latest"
        Write-Host "Fetching latest RustDesk release info..."
        
        # 使用 GitHub API 获取最新发布信息
        $releaseInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" -Headers @{ "User-Agent" = "GitHub-Actions" }
        $zipUrl = $releaseInfo.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1 -ExpandProperty browser_download_url
        
        if ($zipUrl) {
          Write-Host "Downloading RustDesk release from: $zipUrl"
          $zipFile = "rustdesk-latest.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile
          
          Write-Host "Extracting sciter.dll from zip..."
          Expand-Archive -Path $zipFile -DestinationPath "rustdesk-extracted" -Force
          
          $sciterDll = Get-ChildItem -Path "rustdesk-extracted" -Recurse -Filter "sciter.dll" | Select-Object -First 1
          if ($sciterDll) {
            Write-Host "Found sciter.dll at: $($sciterDll.FullName)"
            Copy-Item $sciterDll.FullName -Destination "target\release\sciter.dll" -Force
            Write-Host "SUCCESS: sciter.dll copied to output directory"
          } else {
            Write-Error "ERROR: sciter.dll not found in RustDesk release zip"
            exit 1
          }
        } else {
          Write-Error "ERROR: Could not find zip asset in RustDesk release"
          exit 1
        }
      shell: pwsh
      timeout-minutes: 10

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: |
          target\release\zowindesk.exe
          target\release\sciter.dll
        retention-days: 30
