name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  LLVM_VERSION: "15.0.6"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.LLVM_VERSION }}

    - name: Set LIBCLANG_PATH
      run: |
        $llvmPath = "${env:LLVM_PATH}\bin"
        if (Test-Path "$llvmPath\libclang.dll") {
          echo "LIBCLANG_PATH=$llvmPath\libclang.dll" >> $env:GITHUB_ENV
          echo "$llvmPath" >> $env:GITHUB_PATH
          echo "Found libclang.dll at $llvmPath"
        } else {
          echo "ERROR: libclang.dll not found at $llvmPath"
          exit 1
        }
      shell: pwsh

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet x64-windows-static \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
      shell: bash
      timeout-minutes: 180

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: C:\vcpkg
        LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

    - name: Download sciter.dll
      run: |
        Write-Host "Downloading sciter.dll for Windows x64..."

        # 方案1: 从 Sciter 官方 SDK 下载 (RustDesk 使用此版本)
        $sciterUrl = "https://sciter.com/sdk/sciter64.dll"
        $outputPath = "target\release\sciter.dll"

        try {
          Invoke-WebRequest -Uri $sciterUrl -OutFile $outputPath -ErrorAction Stop
          Write-Host "SUCCESS: sciter.dll downloaded from Sciter official SDK"
          
          # 验证文件是否存在
          if (Test-Path $outputPath) {
            $fileSize = (Get-Item $outputPath).Length
            Write-Host "sciter.dll file size: $fileSize bytes"
          } else {
            throw "sciter.dll not found after download"
          }
        } catch {
          Write-Error "ERROR: Failed to download sciter.dll from Sciter official: $_"
          
          # 方案2: 从 RustDesk 最新发布下载 (尝试查找任何 Windows 可执行文件或压缩包)
          Write-Host "Trying to download from RustDesk release..."
          try {
            $releaseInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" -Headers @{ "User-Agent" = "GitHub-Actions" }
            
            # 查找任何包含 windows 和 x64 的 asset
            $assets = $releaseInfo.assets | Where-Object { $_.name -like "*windows*" -or $_.name -like "*x64*" -or $_.name -like "*.zip" -or $_.name -like "*.exe" }
            
            if ($assets) {
              Write-Host "Found assets:"
              $assets | ForEach-Object { Write-Host $_.name }
              
              # 优先下载 .zip 文件
              $zipAsset = $assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
              if ($zipAsset) {
                $assetUrl = $zipAsset.browser_download_url
                Write-Host "Downloading from: $assetUrl"
                $zipFile = "rustdesk-asset.zip"
                Invoke-WebRequest -Uri $assetUrl -OutFile $zipFile
                Expand-Archive -Path $zipFile -DestinationPath "rustdesk-extracted" -Force
                $sciterDll = Get-ChildItem -Path "rustdesk-extracted" -Recurse -Filter "sciter.dll" | Select-Object -First 1
                if ($sciterDll) {
                  Copy-Item $sciterDll.FullName -Destination $outputPath -Force
                  Write-Host "SUCCESS: sciter.dll extracted from RustDesk release"
                } else {
                  throw "sciter.dll not found in RustDesk asset"
                }
              } else {
                throw "No .zip asset found in RustDesk release"
              }
            } else {
              throw "No suitable asset found in RustDesk release"
            }
          } catch {
            Write-Error "ERROR: Failed to download from RustDesk release: $_"
            exit 1
          }
        }
      shell: pwsh
      timeout-minutes: 10

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: |
          target\release\zowindesk.exe
          target\release\sciter.dll
        retention-days: 30
