name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360  # 6 hours timeout

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.28.0

    - name: Install LLVM
      run: choco install llvm --version=17.0.6 -y --no-progress
      shell: pwsh

    - name: Set LIBCLANG_PATH
      run: |
        $llvmPath = "C:\Program Files\LLVM\bin"
        echo "LIBCLANG_PATH=$llvmPath\libclang.dll" >> $env:GITHUB_ENV
        echo "$llvmPath" >> $env:GITHUB_PATH
      shell: pwsh

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgGitCommitId: 'f56238700759b9b6867941e6f80ec6d00d03b3ec'
        runVcpkgInstall: true
      env:
        VCPKG_DEFAULT_TRIPLET: x64-windows-static

    - name: Set vcpkg environment
      run: |
        echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
        echo "${{ github.workspace }}\vcpkg" >> $env:GITHUB_PATH
      shell: pwsh

    - name: Install vcpkg dependencies
      run: |
        cd "${{ github.workspace }}\vcpkg"
        .\vcpkg.exe install libvpx opus openssl
      shell: pwsh
      timeout-minutes: 120

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: '${{ github.workspace }}\vcpkg'
        LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: target\release\zowindesk.exe
        retention-days: 30
