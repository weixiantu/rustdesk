name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  LLVM_VERSION: "15.0.6"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.LLVM_VERSION }}

    - name: Set LIBCLANG_PATH
      run: |
        $llvmPath = "${env:LLVM_PATH}\bin"
        if (Test-Path "$llvmPath\libclang.dll") {
          echo "LIBCLANG_PATH=$llvmPath\libclang.dll" >> $env:GITHUB_ENV
          echo "$llvmPath" >> $env:GITHUB_PATH
          echo "Found libclang.dll at $llvmPath"
        } else {
          echo "ERROR: libclang.dll not found at $llvmPath"
          exit 1
        }
      shell: pwsh

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet x64-windows-static \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
      shell: bash
      timeout-minutes: 180

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: C:\vcpkg
        LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

    - name: Create sciter.dll download instructions
      run: |
        Write-Host "Creating sciter.dll download instructions..."

        $readmeContent = @"
========================================================
ZowinDesk Windows - 使用说明
========================================================

重要提示：运行 zowindesk.exe 需要 sciter.dll

请按以下步骤操作：

方法1：从 RustDesk 官方下载
1. 访问：https://rustdesk.net/
2. 下载 "Windows Portable" 版本（便携版）
3. 解压下载的 ZIP 文件
4. 复制 sciter.dll 到 zowindesk.exe 所在目录

方法2：从 Sciter 官方 SDK 下载
1. 访问：https://sciter.com/sdk/
2. 下载 Sciter SDK
3. 从 bin/64/ 目录复制 sciter.dll
4. 将 sciter.dll 放在 zowindesk.exe 同一目录

验证：
- 确保 sciter.dll 和 zowindesk.exe 在同一个目录
- 双击 zowindesk.exe 运行

技术说明：
- sciter.dll 是 Sciter UI 引擎的运行时库
- ZowinDesk 使用 Sciter 作为 GUI 框架
- 必须将 sciter.dll 放在可执行文件同一目录

"@

        # 写 UTF-8 编码的 README 文件
        $utf8 = [System.Text.Encoding]::UTF8
        [System.IO.File]::WriteAllText("target\release\使用说明.txt", $readmeContent, $utf8)

        Write-Host "Created 使用说明.txt"
        Write-Host "Build completed successfully!"
      shell: pwsh
      timeout-minutes: 2

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: |
          target\release\zowindesk.exe
          target\release\使用说明.txt
        retention-days: 30
