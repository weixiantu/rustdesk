name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.28.0

    - name: Setup LLVM and libclang
      run: |
        $llvmPaths = @(
          "C:\Program Files\LLVM\bin",
          "C:\Program Files (x86)\LLVM\bin",
          "C:\ProgramData\chocolatey\lib\llvm\tools\llvm\bin"
        )
        $found = $false
        foreach ($p in $llvmPaths) {
          if (Test-Path "$p\libclang.dll") {
            echo "LIBCLANG_PATH=$p\libclang.dll" >> $env:GITHUB_ENV
            echo "$p" >> $env:GITHUB_PATH
            echo "Found libclang.dll at $p"
            $found = $true
            break
          }
        }
        if (-not $found) {
          echo "ERROR: libclang.dll not found!"
          exit 1
        }
      shell: pwsh

    - name: Setup vcpkg
      run: |
        # vcpkg is pre-installed on windows-2022 runner at C:\vcpkg
        $vcpkgRoot = "C:\vcpkg"
        if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
          echo "ERROR: vcpkg.exe not found at $vcpkgRoot"
          exit 1
        }
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH
        echo "Using vcpkg at $vcpkgRoot"
        # Ensure vcpkg is up to date
        cd $vcpkgRoot
        git pull
        .\bootstrap-vcpkg.bat -disableMetrics
      shell: pwsh
      timeout-minutes: 10

    - name: Install vcpkg dependencies
      run: |
        $vcpkgRoot = $env:VCPKG_ROOT
        echo "Installing dependencies using vcpkg at $vcpkgRoot"
        & "$vcpkgRoot\vcpkg.exe" install libvpx:x64-windows-static
        & "$vcpkgRoot\vcpkg.exe" install opus:x64-windows-static
        & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows-static
      shell: pwsh
      timeout-minutes: 120

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: target\release\zowindesk.exe
        retention-days: 30
