name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  LLVM_VERSION: "15.0.6"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.LLVM_VERSION }}

    - name: Set LIBCLANG_PATH
      run: |
        $llvmPath = "${env:LLVM_PATH}\bin"
        if (Test-Path "$llvmPath\libclang.dll") {
          echo "LIBCLANG_PATH=$llvmPath\libclang.dll" >> $env:GITHUB_ENV
          echo "$llvmPath" >> $env:GITHUB_PATH
          echo "Found libclang.dll at $llvmPath"
        } else {
          echo "ERROR: libclang.dll not found at $llvmPath"
          exit 1
        }
      shell: pwsh

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet x64-windows-static \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
      shell: bash
      timeout-minutes: 180

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: C:\vcpkg
        LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

    - name: Download sciter.dll
      run: |
        $outputPath = "target\release\sciter.dll"

        # 尝试多个下载源
        $downloadSources = @(
          "https://sciter.com/bin/64/sciter.dll",
          "https://raw.githubusercontent.com/rustdesk/rustdesk/master/libs/sciter.dll"
        )

        $success = $false
        foreach ($url in $downloadSources) {
          try {
            Write-Host "Trying to download from: $url"
            Invoke-WebRequest -Uri $url -OutFile $outputPath -ErrorAction Stop

            # 验证文件是否是有效的 DLL (检查 MZ 头)
            $bytes = [System.IO.File]::ReadAllBytes($outputPath)
            $header = [System.Text.Encoding]::ASCII.GetString($bytes[0..1])
            if ($header -eq "MZ") {
              Write-Host "SUCCESS: sciter.dll downloaded from: $url"
              $success = $true
              break
            } else {
              Write-Host "WARNING: Downloaded file is not a valid DLL, trying next source..."
              Remove-Item $outputPath -Force -ErrorAction SilentlyContinue
            }
          } catch {
            Write-Host "WARNING: Failed to download from $url : $_"
          }
        }

        if (-not $success) {
          Write-Error "ERROR: Failed to download sciter.dll from all sources"
          Write-Host "Please manually download sciter.dll and commit it to the repository"
          exit 1
        }

        # 最终验证
        $fileSize = (Get-Item $outputPath).Length
        Write-Host "sciter.dll downloaded successfully (size: $fileSize bytes)"
      shell: pwsh
      timeout-minutes: 10

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: |
          target\release\zowindesk.exe
          target\release\sciter.dll
        retention-days: 30
