name: Build ZowinDesk Windows

on:
  push:
    branches: [ zowindesk, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.28.0

    - name: Setup LLVM and libclang
      run: |
        $llvmPaths = @(
          "C:\Program Files\LLVM\bin",
          "C:\Program Files (x86)\LLVM\bin",
          "C:\ProgramData\chocolatey\lib\llvm\tools\llvm\bin"
        )
        $found = $false
        foreach ($p in $llvmPaths) {
          if (Test-Path "$p\libclang.dll") {
            echo "LIBCLANG_PATH=$p\libclang.dll" >> $env:GITHUB_ENV
            echo "$p" >> $env:GITHUB_PATH
            echo "Found libclang.dll at $p"
            $found = $true
            break
          }
        }
        if (-not $found) {
          echo "ERROR: libclang.dll not found!"
          exit 1
        }
      shell: pwsh

    - name: Setup vcpkg
      run: |
        # Use pre-installed vcpkg on Windows runner, or clone if missing
        $vcpkgPaths = @("C:\vcpkg", "C:\Program Files\vcpkg")
        $found = $false
        foreach ($p in $vcpkgPaths) {
          if (Test-Path "$p\vcpkg.exe") {
            echo "VCPKG_ROOT=$p" >> $env:GITHUB_ENV
            echo "$p" >> $env:GITHUB_PATH
            echo "Using pre-installed vcpkg at $p"
            $found = $true
            break
          }
        }
        if (-not $found) {
          echo "Cloning vcpkg..."
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:TEMP\vcpkg"
          cd "$env:TEMP\vcpkg"
          .\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=$env:TEMP\vcpkg" >> $env:GITHUB_ENV
          echo "$env:TEMP\vcpkg" >> $env:GITHUB_PATH
        }
      shell: pwsh
      timeout-minutes: 10

    - name: Install vcpkg dependencies
      run: |
        vcpkg install libvpx:x64-windows-static
        vcpkg install opus:x64-windows-static
        vcpkg install openssl:x64-windows-static
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

    - name: Build ZowinDesk
      run: cargo build --release --features inline
      shell: pwsh
      timeout-minutes: 120
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}

    - name: Upload ZowinDesk executable
      uses: actions/upload-artifact@v4
      with:
        name: zowindesk-windows
        path: target\release\zowindesk.exe
        retention-days: 30
